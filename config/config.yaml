# OpenClaw 多源异构分析系统 配置文件
# 各 Agent 的子段仅给出推荐字段，具体扩展由各 Agent 负责人按需补充。

project:
  name: "openclaw-analysis-system"
  version: "0.1.0"

paths:
  raw_data_dir: "data/raw"
  output_dir: "data/processed"

# ---------------------------------------------------------------------------
# DeepSeek（OpenAI 兼容）：Chat 分析与审计
# ---------------------------------------------------------------------------
openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "OPENAI_API_KEY"
  base_url_env: "OPENAI_API_BASE"

# ---------------------------------------------------------------------------
# 智谱 AI（OpenAI 兼容）：Embedding 向量化
# ---------------------------------------------------------------------------
zhipu:
  api_key: "${ZHIPU_API_KEY}"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  embedding_model: "embedding-3"
  api_key_env: "ZHIPU_API_KEY"
  base_url_env: "ZHIPU_API_BASE"

# ---------------------------------------------------------------------------
# 各 Agent 的独立配置段（占位，由对应负责人按需扩展）
# ---------------------------------------------------------------------------
collector: {}

analyst: {}

generator:
  report:
    title: "2025年某产品销售与市场分析报告"
    default_output: "data/processed/sales_and_market_report_2025.md"

reviewer: {}
