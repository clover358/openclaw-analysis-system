# OpenClaw 多源异构分析系统 配置文件
# 各 Agent 的子段仅给出推荐字段，具体扩展由各 Agent 负责人按需补充。

project:
  name: "openclaw-analysis-system"
  version: "0.1.0"

paths:
  raw_data_dir: "data/raw"
  output_dir: "data/processed"
  pdf_output_dir: "data/outputs"

# ---------------------------------------------------------------------------
# DeepSeek（OpenAI 兼容）：Chat 分析与审计
# ---------------------------------------------------------------------------
openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "OPENAI_API_KEY"
  base_url_env: "OPENAI_API_BASE"

# ---------------------------------------------------------------------------
# 智谱 AI（OpenAI 兼容）：Embedding 向量化
# ---------------------------------------------------------------------------
zhipu:
  api_key: "${ZHIPU_API_KEY}"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  embedding_model: "embedding-3"
  api_key_env: "ZHIPU_API_KEY"
  base_url_env: "ZHIPU_API_BASE"
  embedding_batch_size: 32

# ---------------------------------------------------------------------------
# 各 Agent 的独立配置段（由对应负责人按需扩展）
# ---------------------------------------------------------------------------
collector:
  # 当前 Collector 为 Playwright + CDP 采集 OpenRouter rankings，运行时会生成 data/merged_rankings.json
  rankings_json: "data/merged_rankings.json"
  industry_report_url: "https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_4_economy.pdf"
  industry_report_pdf: "data/ai_index_report_2026_chapter_4_economy.pdf"

analyst:
  data:
    merged_rankings: "data/merged_rankings.json"
    market_share: "data/Market Share.json"
    top_model: "data/Top Model.json"
    day_leaderboard: "data/day_leaderboard.json"
    week_leaderboard: "data/week_leaderboard.json"
    month_leaderboard: "data/month_leaderboard.json"
    excel_output: "data/processed/openrouter_rankings.xlsx"
    ai_index_pdf: "data/ai_index_report_2026_chapter_4_economy.pdf"
  rag:
    chunk_size: 1200
    chunk_overlap: 120
    top_k: 4
    vector_store_dir: "data/processed/faiss_index"
  debug:
    use_fake_embeddings: false
  retrieval:
    openai_query: "OpenAI GPT API token usage market share rank OpenRouter model leaderboard"
    competitor_query: "Google Gemini Anthropic Claude DeepSeek Qwen Meta API competitor token usage market share"
    industry_query: "LLM API industry trend context length open source model adoption OpenRouter Top Apps"

generator:
  report:
    title: ""
    default_output: "data/processed/openrouter_llm_market_report.md"

reviewer:
  llm:
    temperature: 0.1

# ---------------------------------------------------------------------------
# 飞书 AI Agent（事件订阅，与群自定义机器人 Webhook 是两套机制）
# ---------------------------------------------------------------------------
feishu_agent:
  webhook_path: "/feishu/webhook"
  server_port: 8000
  trigger_phrases:
    - "给我发送竞品报告"
    - "给我生成竞品报告"
    - "生成竞品报告"
    - "生成竞品分析报告"
    - "竞品报告"