# OpenClaw 多源异构分析系统 配置文件
# 主题：基于 OpenRouter API 中转站的 LLM 厂商商业格局分析
# 主产品：OpenAI 旗下所有模型；竞品：除 OpenAI 之外的所有厂商

project:
  name: "openclaw-analysis-system"
  version: "0.2.0"

paths:
  raw_data_dir: "data/raw"
  output_dir: "data/processed"

# ---------------------------------------------------------------------------
# DeepSeek（OpenAI 兼容）：Chat 分析与审计
# ---------------------------------------------------------------------------
openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "OPENAI_API_KEY"
  base_url_env: "OPENAI_API_BASE"

# ---------------------------------------------------------------------------
# 智谱 AI（OpenAI 兼容）：Embedding 向量化
# ---------------------------------------------------------------------------
zhipu:
  api_key: "${ZHIPU_API_KEY}"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  embedding_model: "embedding-3"
  api_key_env: "ZHIPU_API_KEY"
  base_url_env: "ZHIPU_API_BASE"
  embedding_batch_size: 32

# ---------------------------------------------------------------------------
# 各 Agent 的独立配置段
# ---------------------------------------------------------------------------
collector:
  # OpenRouter rankings 由 Playwright 交互式抓取后合并到 data/merged_rankings.json
  rankings_json: "data/merged_rankings.json"
  # 行业报告：Stanford HAI AI Index 2026 Chapter 4 Economy
  industry_report_url: "https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_4_economy.pdf"
  industry_report_pdf: "data/ai_index_report_2026_chapter_4_economy.pdf"

analyst:
  preprocess:
    rankings_json: "data/merged_rankings.json"
    output_xlsx: "data/processed/openrouter_rankings.xlsx"
  rag:
    chunk_size: 600
    chunk_overlap: 80
    top_k: 4
    vector_store_dir: "data/processed/faiss_index"
  debug:
    use_fake_embeddings: false
  retrieval:
    openai_query: "OpenAI GPT 模型 OpenRouter tokens 排名 份额 vendor_summary leaderboard"
    competitor_query: "Anthropic Google Meta DeepSeek xAI Qwen Mistral 模型 份额 排名 竞品 leaderboard market_share"
    industry_query: "AI Index 经济 应用 类别 编程语言 上下文长度 趋势 OpenRouter Top Apps categories programming"
  # vendor 前缀 → 显示名（覆盖/补充 DEFAULT_VENDOR_MAPPING）
  vendor_mapping:
    openai: "OpenAI"
    anthropic: "Anthropic"
    google: "Google"
    meta-llama: "Meta"
    mistralai: "Mistral"
    deepseek: "DeepSeek"
    qwen: "Alibaba (Qwen)"
    x-ai: "xAI"
    moonshotai: "Moonshot"

generator:
  report:
    # 标题留空，由 Generator 在运行时基于当前日期动态生成
    # （形如 "OpenRouter LLM 厂商商业格局分析报告（YYYY-MM）"）
    title: ""
    default_output: "data/processed/openrouter_llm_market_report.md"

reviewer:
  llm:
    temperature: 0.1
