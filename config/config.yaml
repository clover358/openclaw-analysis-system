# OpenClaw 多源异构分析系统 配置文件
# 各 Agent 的子段仅给出推荐字段，具体扩展由各 Agent 负责人按需补充。

project:
  name: "openclaw-analysis-system"
  version: "0.1.0"

paths:
  raw_data_dir: "data/raw"
  output_dir: "data/processed"
  pdf_output_dir: "data/outputs"

# ---------------------------------------------------------------------------
# DeepSeek（OpenAI 兼容）：Chat 分析与审计
# ---------------------------------------------------------------------------
openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "OPENAI_API_KEY"
  base_url_env: "OPENAI_API_BASE"

# ---------------------------------------------------------------------------
# 智谱 AI（OpenAI 兼容）：Embedding 向量化
# ---------------------------------------------------------------------------
zhipu:
  api_key: "${ZHIPU_API_KEY}"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  embedding_model: "embedding-3"
  api_key_env: "ZHIPU_API_KEY"
  base_url_env: "ZHIPU_API_BASE"
  embedding_batch_size: 32

# ---------------------------------------------------------------------------
# 各 Agent 的独立配置段（由对应负责人按需扩展）
# ---------------------------------------------------------------------------
collector:
  ai_api_sources:
    - path: "data/Market Share.json"
      label: "API 厂商市场份额（按 Token 调用量）"
      source_type: "api_market_share"
    - path: "data/Top Model.json"
      label: "热门大模型 API 调用排行"
      source_type: "api_model_ranking"
    - path: "data/Context Length.json"
      label: "上下文长度维度 API 使用分布"
      source_type: "api_context_length"
    - path: "data/merged_rankings.json"
      label: "多维度综合 API 排行榜"
      source_type: "api_merged_rankings"

analyst:
  rag:
    chunk_size: 500
    chunk_overlap: 50
    top_k: 3
    vector_store_dir: "data/processed/faiss_index"
  debug:
    use_fake_embeddings: false
  retrieval:
    sales_query: "DeepSeek OpenAI API token usage market share platform ranking"
    industry_query: "LLM API industry trend context length model capability 2025"
    competitor_query: "Anthropic Google Gemini Claude GPT competitor API comparison"

generator:
  report:
    title: "2025年大模型 API 竞品分析报告"
    default_output: "data/processed/ai_api_competitor_report_2025.md"

reviewer:
  llm:
    temperature: 0.1

# ---------------------------------------------------------------------------
# 飞书 AI Agent（事件订阅，与群自定义机器人 Webhook 是两套机制）
# ---------------------------------------------------------------------------
feishu_agent:
  webhook_path: "/feishu/webhook"
  server_port: 8000
  trigger_phrases:
    - "给我发送竞品报告"
    - "给我生成竞品报告"
    - "生成竞品报告"
    - "生成竞品分析报告"
    - "竞品报告"